[workspace]
members = [
  "crates/vela-dev",
  "crates/vela-extensions",
  "crates/vela-kernel",
  "crates/vela-python-workbench",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "UNLICENSED"
rust-version = "1.96"
version = "0.1.0"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = "0.9"
wasmtime = { version = "=47.0.2", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
rusqlite = "0.37"
rustix = { version = "1.1", features = ["fs"] }
tempfile = "3.20"
